<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FreeWrite — доска</title>
<style>
  :root {
    --desk: #e6eaf0; --paper: #fcfdfe; --ink: #16223a; --ink2: #4b5873; --muted: #8592a8;
    --rule: #d3dae5; --accent: #d4470c; --accent-soft: #fbe6dc; --ok: #23803a; --bad: #be2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--desk); color: var(--ink);
    font: 15px/1.4 Roboto, "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
    border-radius: 10px; padding: 7px 12px; font-weight: 600; }
  button:hover { border-color: var(--ink2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: 7px 11px; min-width: 38px; }
  [hidden] { display: none !important; }

  /* Вход */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; padding: 24px; width: 100%; max-width: 420px;
    box-shadow: 0 8px 30px rgba(22, 34, 58, .08); }
  .card h1 { margin: 0 0 4px; font-size: 22px; }
  .card p { margin: 6px 0 16px; color: var(--ink2); }
  #code { width: 100%; font: 600 26px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 3px; text-align: center;
    padding: 12px; border: 1.5px solid var(--rule); border-radius: 12px; text-transform: uppercase; color: var(--ink); background: #fff; }
  #code:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  .err { color: var(--bad); min-height: 22px; margin-top: 10px; font-size: 14px; }
  .small { color: var(--muted); font-size: 13px; }

  /* Доска */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--paper); border-bottom: 1px solid var(--rule);
    flex-wrap: wrap; }
  header .title { font-weight: 700; font-size: 17px; margin-right: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  header .state { color: var(--ink2); font-size: 13px; margin-right: auto; white-space: nowrap; }
  header .zoom { font: 12px ui-monospace, Consolas, monospace; color: var(--ink2); min-width: 46px; text-align: center; }
  #stage { position: relative; flex: 1; overflow: hidden; background: var(--paper); touch-action: none; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #c.drag { cursor: grabbing; }
  #progress { position: absolute; left: 12px; bottom: 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
    padding: 4px 9px; font-size: 13px; color: var(--ink2); }

  /* Легенда */
  #legend { position: absolute; right: 12px; top: 12px; width: 300px; max-width: calc(100% - 24px); max-height: calc(100% - 24px); overflow: auto;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 12px; box-shadow: 0 6px 24px rgba(22, 34, 58, .10); }
  #legend h3 { margin: 0; font-size: 15px; flex: 1; }
  #legend select { width: 100%; margin: 8px 0 4px; font: inherit; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    border: 0; border-radius: 8px; padding: 6px 8px; }
  .group { font-size: 13px; font-weight: 700; color: var(--ink2); margin: 10px 0 2px; }
  .st { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .st:hover { background: var(--desk); }
  .st.on { background: var(--accent-soft); border-color: var(--accent); }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .st .n { margin-left: auto; font-weight: 700; color: var(--ink2); }
  .checks { font-size: 13px; color: var(--ink2); padding: 4px 8px; }

  /* Окна */
  .modal { position: fixed; inset: 0; background: rgba(22, 34, 58, .35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal .card { max-width: 760px; max-height: calc(100% - 32px); display: flex; flex-direction: column; }
  .modal .body { overflow: auto; margin: 8px 0 12px; }
  .sec { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .sec:hover { border-color: var(--ink2); }
  .sec b { font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 12px; }
  .link { font: 15px ui-monospace, Consolas, monospace; padding: 10px; background: var(--desk); border-radius: 8px; word-break: break-all; user-select: all; }
  @media (max-width: 700px) {
    header .title { max-width: 60vw; }
    #legend { top: auto; bottom: 12px; max-height: 45%; }
  }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>FreeWrite</h1>
    <p>Доска с планшета — для просмотра с компьютера. Введите код доски.</p>
    <form id="loginForm" autocomplete="off">
      <input id="code" maxlength="9" placeholder="XXXX-XXXX" inputmode="latin" spellcheck="false" autofocus>
      <div class="err" id="loginErr"></div>
      <div class="row" style="justify-content: flex-end"><button class="primary" type="submit" id="openBtn">Открыть</button></div>
    </form>
    <p class="small">Код — в приложении FreeWrite под названием общей доски («код XXXX-XXXX») или ссылка, которую прислали.
      На сайте доску можно только смотреть.</p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <span class="title" id="title">Доска</span>
    <span class="state" id="state">только просмотр</span>
    <button class="icon" id="zoomOut" title="Отдалить">−</button>
    <span class="zoom" id="zoom">100%</span>
    <button class="icon" id="zoomIn" title="Приблизить">+</button>
    <button id="fit" title="Показать всю доску">Вся доска</button>
    <button id="legendBtn">Статусы</button>
    <button id="summaryBtn">Сводка</button>
    <button id="linkBtn" hidden title="Ссылка, по которой доску можно только смотреть">Ссылка для руководства</button>
    <button id="logout" title="Забыть код на этом компьютере">Выйти</button>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="legend" hidden></div>
    <div id="progress" hidden></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="card"><h1 id="mTitle"></h1><div class="body" id="mBody"></div>
  <div class="row" style="justify-content: flex-end" id="mButtons"></div></div></div>

<script>
"use strict";
// FreeWrite — сайт для просмотра общей доски (FW-003). Данные — тем же запросом pull, что у приложения,
// картинки — img_get частями. Ничего не отправляет на доску: только смотреть.

const API = location.origin + location.pathname;
const $ = (id) => document.getElementById(id);
const C = { desk: "#e6eaf0", paper: "#fcfdfe", ink: "#16223a", ink2: "#4b5873", muted: "#8592a8", rule: "#d3dae5",
  line: "rgba(40,80,140,0.118)", accent: "#d4470c", ok: "#23803a", bad: "#be2a2a" };
const FONT = 'Roboto, "Segoe UI", system-ui, Arial, sans-serif';
const MIN_Z = 0.01, MAX_Z = 5, ROW_FONT = 15, ROW_BOX = 22, MIN_PX = 0.8;

// ------------------------------------------------------------ сервер

async function api(op, body) {
  let last;
  for (let attempt = 0; attempt < 5; attempt++) {
    let r;
    try {
      r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ op }, body || {})) });
    } catch (e) { last = new Error("Нет связи с сервером"); await sleep(1500 * (attempt + 1)); continue; }
    let o = {};
    try { o = await r.json(); } catch (e) { /* не JSON */ }
    if (r.ok) return o;
    const err = new Error(o.message || ("Ошибка сервера " + r.status));
    err.code = o.error || "http"; err.status = r.status;
    // Сервер занят (база «дышит» с ограничением) — подождать и повторить.
    if (r.status === 503 || r.status === 429 || r.status >= 500) { last = err; await sleep(1500 * (attempt + 1)); continue; }
    throw err;
  }
  throw last;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ------------------------------------------------------------ хранилище браузера (повторное открытие — быстро)

const DB = (() => {
  let db = null;
  function open() {
    if (db) return Promise.resolve(db);
    return new Promise((res) => {
      try {
        const q = indexedDB.open("freewrite-viewer", 1);
        q.onupgradeneeded = () => { q.result.createObjectStore("boards"); q.result.createObjectStore("images"); };
        q.onsuccess = () => { db = q.result; res(db); };
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function get(store, key) {
    const d = await open(); if (!d) return null;
    return new Promise((res) => { try { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } });
  }
  async function put(store, key, val) {
    const d = await open(); if (!d) return;
    return new Promise((res) => { try { const t = d.transaction(store, "readwrite"); t.objectStore(store).put(val, key); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } });
  }
  return { get, put };
})();

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* приватное окно */ } }

// ------------------------------------------------------------ цвета (как в приложении)

function argb(c) { return { a: ((c >>> 24) & 255) / 255, r: (c >>> 16) & 255, g: (c >>> 8) & 255, b: c & 255 }; }
function css(c, alpha) { const x = argb(c); return `rgba(${x.r},${x.g},${x.b},${alpha == null ? x.a : alpha})`; }
function lin(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
function statusFg(c) {
  const x = argb(c); const l = 0.2126 * lin(x.r) + 0.7152 * lin(x.g) + 0.0722 * lin(x.b);
  const k = l > 0.45 ? 0.55 : l > 0.25 ? 0.8 : 1;
  return `rgb(${Math.floor(x.r * k)},${Math.floor(x.g * k)},${Math.floor(x.b * k)})`;
}
function statusBg(c) { const x = argb(c); const m = (v) => Math.floor(v + (255 - v) * 0.78); return `rgb(${m(x.r)},${m(x.g)},${m(x.b)})`; }

// ------------------------------------------------------------ доска

const B = {
  board: null, key: null, edit: false, title: "Доска", seq: 0,
  objs: new Map(),      // id → {k, rev, d}
  order: [],            // порядок статусов (~order)
  // разобранное — пересобирается после каждой порции правок
  statuses: [], strokes: [], texts: [], images: [], fills: [], frames: [], callouts: [], stickers: [], rows: [],
  tables: [], recs: [],  // таблицы ИД и их строки (0.20, ТЗ «Учёт ИГС»)
  vedoms: [], vitems: [], // ведомости и их позиции (0.21)
  zones: [], // области захваток на листах плана таблиц (0.23)
};

function rebuild() {
  const by = { status: [], stroke: [], text: [], image: [], fill: [], frame: [], callout: [], sticker: [], row: [], table: [], rec: [], vedom: [], vitem: [], zone: [] };
  B.title = "Доска";
  for (const [id, o] of B.objs) {
    if (id === "~title") { if (o.d && o.d.title) B.title = o.d.title; continue; }
    if (id === "~order") { B.order = (o.d && o.d.order) || []; continue; }
    if (by[o.k]) by[o.k].push(o);
  }
  const pos = new Map(B.order.map((id, i) => [id, i]));
  B.statuses = by.status.map((o) => ({ id: o.id, name: o.d.name || "Статус", color: o.d.color | 0, done: !!o.d.done,
    group: ["con", "ck", "dwg"].includes(o.d.g) ? o.d.g : "id" }))
    .sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9));
  B.strokes = by.stroke.map(prepStroke).filter(Boolean);
  B.texts = by.text.map((o) => o.d);
  B.images = by.image.map((o) => o.d);
  B.fills = by.fill.map((o) => prepFill(o.d)).filter(Boolean);
  B.frames = by.frame.map((o) => o.d);
  B.callouts = by.callout.map((o) => o.d);
  B.stickers = by.sticker.map((o) => o.d);
  B.rows = by.row.map((o) => o.d);
  B.tables = by.table.map((o) => o.d);
  const tids = new Set(B.tables.map((t) => t.id));
  B.recs = by.rec.map((o) => o.d).filter((r) => tids.has(r.t));
  for (const t of B.tables) t._lay = null;
  B.vedoms = by.vedom.map((o) => o.d);
  B.vitems = by.vitem.map((o) => o.d);
  B.zones = by.zone.map((o) => o.d).filter((z) => tids.has(z.t) && Array.isArray(z.pts) && z.pts.length >= 6);
  // Открытая вкладка плана — своя у каждой таблицы, переживает обновление доски.
  for (const t of B.tables) t._tab = TAB.get(t.id) || 0;
  for (const t of B.texts) t._w = null;
  for (const c of B.callouts) c._w = null;
  for (const r of B.rows) r._key = null;
}

function status(id) { return B.statuses.find((s) => s.id === id) || B.statuses[0] || { id: "", name: "Статус", color: 0xff8592a8 | 0, group: "id" }; }
function statuses(group) { return B.statuses.filter((s) => s.group === group); }

function prepStroke(o) {
  const d = o.d; const p = d.pts || [];
  const n = Math.floor(p.length / 3);
  if (!n) return null;
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity, uniform = true;
  for (let i = 0; i < n; i++) {
    const x = p[i * 3], y = p[i * 3 + 1];
    if (x < l) l = x; if (x > r) r = x; if (y < t) t = y; if (y > b) b = y;
    if (p[i * 3 + 2] !== p[2]) uniform = false;
  }
  const w = d.w || 3;
  return { kind: d.kind || "pen", color: d.color | 0, w, p, n, uniform, l: l - w, t: t - w, r: r + w, b: b + w, path: null };
}

function strokePath(s) {
  if (s.path) return s.path;
  const p = s.p, n = s.n, path = new Path2D();
  path.moveTo(p[0], p[1]);
  if (s.kind === "pen" && s.uniform) { for (let i = 1; i < n; i++) path.lineTo(p[i * 3], p[i * 3 + 1]); }
  else {
    for (let i = 1; i < n; i++) {
      const ax = p[i * 3 - 3], ay = p[i * 3 - 2], bx = p[i * 3], by = p[i * 3 + 1];
      path.quadraticCurveTo(ax, ay, (ax + bx) / 2, (ay + by) / 2);
    }
    path.lineTo(p[(n - 1) * 3], p[(n - 1) * 3 + 1]);
  }
  s.path = path;
  return path;
}

function fillCenter(f) {
  const p = f.pts, n = p.length >> 1; let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { const j = (i + 1) % n, cr = p[i * 2] * p[j * 2 + 1] - p[j * 2] * p[i * 2 + 1]; a += cr; cx += (p[i * 2] + p[j * 2]) * cr; cy += (p[i * 2 + 1] + p[j * 2 + 1]) * cr; }
  if (Math.abs(a) > 1e-6) { const x = cx / (3 * a), y = cy / (3 * a); if (mctx.isPointInPath(f.path, x, y)) return [x, y]; }
  return [(f.l + f.r) / 2, (f.t + f.b) / 2];
}
function prepFill(d) {
  const p = d.pts || []; if (p.length < 6) return null;
  const path = new Path2D(); path.moveTo(p[0], p[1]);
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (let i = 0; i + 1 < p.length; i += 2) {
    if (i) path.lineTo(p[i], p[i + 1]);
    l = Math.min(l, p[i]); r = Math.max(r, p[i]); t = Math.min(t, p[i + 1]); b = Math.max(b, p[i + 1]);
  }
  path.closePath();
  return { color: d.color | 0, alpha: d.alpha == null ? 0.35 : d.alpha, path, l, t, r, b, pts: p, lt: d.lt || "", lu: d.lu || "", lz: d.lz || "", ln: d.ln !== 0 };
}

// Размеры как в приложении (BoardView).
const mctx = document.createElement("canvas").getContext("2d");
function measure(text, size, bold) { mctx.font = (bold ? "bold " : "") + size + "px " + FONT; return mctx.measureText(text).width; }
function textW(t) { if (t._w == null) { t._lines = String(t.text || "").split("\n"); t._w = Math.max(...t._lines.map((l) => measure(l, t.size, false)), 1); } return t._w; }
function textBottom(t) { textW(t); return t.y + (t._lines.length - 1) * t.size * 1.25 + t.size * 0.3; }
function stickerW(s) { return Math.max(128, status(s.sid).name.length * 9.4 + 40) * s.scale; }
function calloutBox(c) {
  const name = status(c.sid).name; const key = c.title + "\u0001" + name;
  if (c._w == null || c._wk !== key) {
    const tw = measure(c.title || " ", 15, false), sw = measure(name, 14, true);
    c._w = Math.max(150, Math.max(tw, sw) + 24); c._wk = key;
  }
  return { l: c.x, t: c.y, r: c.x + c._w * c.scale, b: c.y + 60 * c.scale };
}
function rowLayout(r) {
  const st = status(r.sid).name; const key = (r.title || "") + "\u0001" + st;
  if (r._key === key) return r._parts;
  const pad = 12; let x = 0; const p = [0, 0, 0, 0, 0];
  x += r.title ? pad + measure(r.title, ROW_FONT, true) + pad : 0; p[1] = x;
  x += pad + measure("Чек-лист", ROW_FONT, false) + 8 + ROW_BOX + pad; p[2] = x;
  x += pad + measure("DWG", ROW_FONT, false) + 8 + ROW_BOX + pad; p[3] = x;
  x += pad + measure("ИГС", ROW_FONT, true) + 8 + measure(st, ROW_FONT, true) + 28 + pad; p[4] = x;
  r._parts = p; r._key = key;
  return p;
}
function rowW(r) { return rowLayout(r)[4] * r.scale; }
function rowH(r) { return 40 * r.scale; }

// ------------------------------------------------------------ таблицы ИД (как TableDraw в приложении)

const TCOLS = ["aosr", "nsch", "uch", "zah", "con", "work", "vol", "date", "ck", "dwg", "igs", "dcust", "dpto", "who", "note"];
const TNAME = { uch: "Участок", zah: "Захватка", con: "Тип конструкции", work: "Вид работ", nsch: "№ схемы", aosr: "№ АОСР", vol: "Объём по схеме", date: "Дата работ", ck: "Чек-лист", dwg: "DWG", igs: "ИГС",
  dcust: "Отдал заказчику", dpto: "Сдано в ПТО", who: "Исполнитель", note: "Примечание" };
const TF = { T: 40, H: 26, R: 30, F: 30, P: 9, FONT: 13, HF: 11, TF: 19 };
const TGROUP = { igs: "id", ck: "ck", dwg: "dwg" };
// Виды таблиц (0.24, как TableKinds в приложении): «Объём по схеме» делится на части. Вид не записан — таблица до 0.24,
// считается «Вертикальными элементами»; "custom" — пустая таблица с одним объёмом.
const KINDS = {
  kj_vert: { section: "КЖ", name: "Вертикальные элементы", parts: [["w", "Стены"], ["c", "Колонны"]], hidden: ["con"] },
  kj_slab: { section: "КЖ", name: "Плиты перекрытия", parts: [["p", "Плита"], ["b", "Балки"]], hidden: ["con"] },
};
const ALL_PARTS = Object.values(KINDS).flatMap((k) => k.parts);
function tKind(t) { return KINDS[t.kind] || (t.kind ? null : KINDS.kj_vert); }
function tParts(t) { const k = tKind(t); return k ? k.parts : []; }
function partOf(k) { return String(k).startsWith("vol.") ? k.slice(4) : null; }
function partName(p) { const x = ALL_PARTS.find((a) => a[0] === p); return x ? x[1] : p; }
function tOrder(t) { const ps = tParts(t); return ps.length ? TCOLS.flatMap((k) => k === "vol" ? ps.map((p) => "vol." + p[0]) : [k]) : TCOLS; }
function tAllCols(t) {
  const order = tOrder(t), ps = tParts(t);
  if (!(t.cols && t.cols.length)) { const hid = (tKind(t) || {}).hidden || []; return order.map((k) => (hid.includes(k) ? { k, h: 1 } : { k })); }
  // Свой список до 0.24 у таблицы с частями: вместо «Объёма по схеме» — части на его месте.
  let cols = [];
  for (const c of t.cols) {
    if (c.k === "vol" && ps.length) { for (const p of ps) if (!t.cols.some((x) => x.k === "vol." + p[0])) cols.push({ k: "vol." + p[0], h: c.h }); }

// План под таблицей (0.23): шапка, вкладки, лист с обрезкой, области захваток, легенда.

      if (on) { ctx.fillStyle = "#d4470c"; ctx.fillRect(rx + 4 * k, ty0 + 5 * k, rw - 8 * k, 2.5 * k); }

// ------------------------------------------------------------ ведомости (как VedomDraw в приложении, 0.21)

const VF = { HD: 58, H: 26, R: 30, F: 30, P: 9, FONT: 13, HF: 11, TF: 19 };
const VKIND = { an: ["На согласование АН", "А", 0xff7b3fc4 | 0], cust: ["На подпись заказчику", "З", 0xffb88a00 | 0],
  pto: ["Сдача в ПТО", "П", 0xff23803a | 0], list: ["Список", "С", 0xff4b5873 | 0] };
const VCOL = { n: "№", cipher: "Шифр", uch: "Участок", zah: "Захватка", con: "Тип конструкции", work: "Вид работ", nsch: "№ схемы", aosr: "№ АОСР", igs: "ИГС сейчас", res: "Ответ", rd: "Дата ответа" };
function vKind(v) { return VKIND[v.kind] || VKIND.list; }
function vAnswers(v) { return (v.kind === "an" || v.kind === "cust") && !!v.given; }
function vItems(v) { return B.vitems.filter((i) => i.v === v.id).sort((a, b) => ((a.o || 0) - (b.o || 0)) || (a.id < b.id ? -1 : 1)); }
function resName(v, res) { return res === "ok" ? (v.kind === "an" ? "Согласовано" : "Подписано") : res === "no" ? "Не согласовано" : res === "fix" ? "Замечания" : "Ждём"; }
function resColor(res) { return res === "ok" ? 0xff23803a | 0 : res === "no" ? 0xff8e1b2f | 0 : res === "fix" ? 0xffd4640c | 0 : 0xff8a93a3 | 0; }
function daysSince(iso) { const d = Date.parse(iso + "T00:00:00"); return isNaN(d) ? 0 : Math.round((Date.now() - d) / 86400000 - 0.5); }
function vClosed(v) {
  if (!v.given) return false;
  if (v.kind === "pto") return true;
  if (v.kind === "an" || v.kind === "cust") { const it = vItems(v); return it.length > 0 && it.every((i) => !!i.res); }
  return false;
}
const VGIVE = { an: "На подписи АН", cust: "На подписи у заказчика", pto: "Сдано в ПТО" };
function vState(v) { return !v.given ? (v.kind === "list" ? "список" : "сборка" + (v.made ? " от " + dShort(v.made) : "")) : vClosed(v) ? "закрыта" : (VGIVE[v.kind] || "передана") + " от " + dShort(v.given); }
function vSummary(v) {
  const it = vItems(v); const head = plural(it.length, "схема", "схемы", "схем");
  if (!vAnswers(v)) return head;
  const parts = [head];
  for (const res of v.kind === "an" ? ["ok", "no", "fix"] : ["ok", "fix"]) { const n = it.filter((i) => i.res === res).length; if (n) parts.push(resName(v, res).toLowerCase() + " " + n); }
  const wait = it.filter((i) => !i.res).length;
  if (wait) parts.push(`ждём ${wait} (${daysSince(v.given)} дн.)`);
  return parts.join(" · ");
}
function vLayout(v) {
  const items = vItems(v);
  const recs = new Map(B.recs.map((r) => [r.id, r]));
  const tabs = new Map(B.tables.map((t) => [t.id, t]));
  const cols = ["n", "cipher"]
    .concat(items.some((i) => (recs.get(i.r) || {}).na) ? ["aosr"] : [], items.some((i) => (recs.get(i.r) || {}).ns) ? ["nsch"] : [],
      items.some((i) => { const r = recs.get(i.r); return r && tabs.has(r.t) ? !!r.u : !!i.lu; }) ? ["uch"] : [],
      ["zah", "con", "work", "igs"], vAnswers(v) ? ["res", "rd"] : []);
  const texts = items.map((i, idx) => {
    const r = recs.get(i.r), t = r && tabs.get(r.t);
    return cols.map((c) => c === "n" ? String(idx + 1) : c === "cipher" ? (t ? fullTitle(t) : i.lt || "") : c === "uch" ? (t ? r.u || "" : i.lu || "") : c === "zah" ? (t ? r.z || "" : i.lz || "")
      : c === "con" ? (t ? r.c || "" : i.lc || "") : c === "work" ? (t ? r.w || "" : i.lw || "")
      : c === "nsch" ? (t ? r.ns || "" : "") : c === "aosr" ? (t ? r.na || "" : "") : c === "igs" ? (t ? stIn("id", r.sid || "i0").name : "строка удалена")
      : c === "res" ? resName(v, i.res || "") : c === "rd" ? dShort(i.rd || "") : "");
  });
  const igsColor = items.map((i) => { const r = recs.get(i.r); return r && tabs.get(r.t) ? stIn("id", r.sid || "i0").color : 0; });
  const title = [v.num, vKind(v)[0]].filter(Boolean).join(" · "), state = vState(v);
  const info = [v.to ? "Кому: " + v.to : "", vSummary(v)].filter(Boolean).join(" · ");
  const key = JSON.stringify([title, state, info, texts, igsColor]);
  if (v._lay && v._lay.key === key) return v._lay;
  const tw = (x, size, bold) => measure(x || "", size, bold) * 1.06 + 2;
  const widths = cols.map((c, ci) => {
    const pill = c === "igs" || c === "res";

// ------------------------------------------------------------ загрузка и обновления

let sinceSaved = 0, saveTimer = 0;

function applyChanges(list) {
  for (const c of list) {
    if (c.x) { B.objs.delete(c.id); continue; }
    let d = null; try { d = JSON.parse(c.d); } catch (e) { continue; }
    const prev = B.objs.get(c.id);
    if (prev && prev.rev > c.rev) continue;
    B.objs.set(c.id, { id: c.id, k: c.k, rev: c.rev, d });
  }
}

async function pullAll(first) {
  let more = true, got = 0;
  while (more) {
    const r = await api("pull", { board: B.board, key: B.key, since: B.seq });
    if (r.seq < B.seq) { // доску на сервере выложили заново — начать с нуля
      B.objs.clear(); B.seq = 0; continue;
    }
    applyChanges(r.changes || []);
    got += (r.changes || []).length;
    B.seq = r.next; more = r.more;
    if (r.title) B.title = r.title;
    if (first) progress(`Загружаю доску: ${B.objs.size} предметов…`);
  }

  return got;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (B.seq === sinceSaved) return;
    sinceSaved = B.seq;
    DB.put("boards", B.board, { seq: B.seq, objs: [...B.objs.values()].map((o) => [o.id, o.k, o.rev, o.d]) });
  }, 1500);
}

async function loadCached() {
  const c = await DB.get("boards", B.board);
  if (!c || !c.objs) return false;
  B.objs.clear();
  for (const [id, k, rev, d] of c.objs) B.objs.set(id, { id, k, rev, d });
  B.seq = c.seq || 0; sinceSaved = B.seq;

}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    try { await pullAll(false); lastOk = Date.now(); updateState(); }
    catch (e) { updateState(e.message); }

}
function updateState(err) {

  $("state").textContent = (B.edit ? "только просмотр (код с правом правки)" : "только просмотр") + (err ? " · нет связи: " + err : t ? " · ✓ " + t : "");
  $("title").textContent = B.title;
  document.title = B.title + " — FreeWrite";

function drawCallout(c, z) {

let interacting = false, dragging = null;

function pointerEnd(e) {

  }

function fitRect(l, t, r, b) {

  for (const s of B.strokes) add(s.l, s.t, s.r, s.b);

let legendSection = null;

    for (const v of [...open, ...other]) {
      h += `<div class="sec" data-v="${esc(v.id)}"><b style="color:${statusFg(vKind(v)[2])}">${esc([v.num, vKind(v)[0]].filter(Boolean).join(" · "))}</b>
        <div class="small">${esc(vState(v))} · ${esc([v.to, vSummary(v)].filter(Boolean).join(" · "))}</div></div>`;
    }
  }
  return h + `<div class="group">Разделы</div>`;
}
function recsCsv() {
  const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
  const tabs = [...B.tables].sort((a, b) => fullTitle(a).localeCompare(fullTitle(b), "ru", { numeric: true }));
  // Части объёма (0.24) — после «Объёма по схеме»: только те, что есть у таблиц доски.
  const used = new Set(tabs.flatMap((t) => tParts(t).map((p) => p[0])));
  const keys = TCOLS.flatMap((k) => k === "vol" ? ["vol", ...ALL_PARTS.filter((p) => used.has(p[0])).map((p) => "vol." + p[0])] : [k]);
  const head = ["Шифр", ...keys.map((k) => partOf(k) ? "Объём · " + partName(partOf(k)) : TNAME[k]), "Ед."];
  const lines = [head.map(q).join(";")];
  for (const t of tabs) for (const r of tRows(t)) {
    const parts = tParts(t).length > 0, hasV = parts ? !!(r.vp && Object.keys(r.vp).length) : !!r.v;
    lines.push([fullTitle(t), ...keys.map((k) => isDate(k) ? (recVal(r, k) ? dShort(recVal(r, k)) : "")
      : k === "vol" ? (r.v && !parts ? String(r.v).replace(".", ",") : "") : partOf(k) ? String(recVal(r, k)).replace(".", ",") : cellText(r, k)),
      hasV ? unitFor(t, r.w || "") : ""].map(q).join(";"));
  }
  const blob = new Blob(["\ufeff" + lines.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${B.title.replace(/[\\/:*?"<>|]/g, " ")} — схемы ИГС ${new Date().toLocaleDateString("ru-RU")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function summary() {
  const data = summaryData();
  let h = igsHtml();
  for (const x of data) {
    const n = x.rows.length;
    h += `<div class="sec" data-f="${x.f ? esc(x.f.id) : ""}"><b>${esc(x.f ? x.f.title || "Раздел" : "Вне разделов")}</b>
      <div class="small">Строк ИД: ${n}${n ? ` · Чек-лист ✓ ${x.rows.filter((r) => r.ck).length} из ${n} · DWG ✓ ${x.rows.filter((r) => r.dwg).length} из ${n}` : ""}${x.st.length ? ` · меток: ${x.st.length}` : ""}</div>
      <div class="chips">${[...x.ids, ...x.cons].filter(([, c]) => c > 0).map(([s, c]) => `<span class="chip" style="color:${statusFg(s.color)};background:${statusBg(s.color)}">${esc(s.name)}: ${c}</span>`).join("")}</div></div>`;
  }
  if (!data.length && !B.vedoms.length) h = `<p>Пока нет строк ИД, меток и выносок.</p>`;
  openModal(B.tables.length ? "Сводка ИГС и разделы" : "Сводка по разделам", h, [
    ...(B.tables.length ? [["Схемы для Excel", () => recsCsv()]] : []),
    ["Скачать для Excel", () => downloadCsv()],
    ["Скопировать таблицу", () => { copy(table("\t")); }],
    ["Готово", closeModal, true],
  ]);
  for (const el of $("mBody").querySelectorAll(".sec")) el.onclick = () => {
    const tb = el.dataset.t && B.tables.find((x) => x.id === el.dataset.t);
    if (tb) { closeModal(); const x = tableBox(tb); fitRect(x.l, x.t, x.r, x.b); return; }
    const vd = el.dataset.v && B.vedoms.find((x) => x.id === el.dataset.v);
    if (vd) { closeModal(); const x = vedomBox(vd); fitRect(x.l, x.t, x.r, x.b); return; }
    const f = B.frames.find((x) => x.id === el.dataset.f); if (!f) return;
    closeModal(); fitRect(f.x, f.y, f.x + f.w, f.y + f.h);
  };
}
function table(sep) {
  const ids = statuses("id"), cons = statuses("con");
  const q = (s) => sep === ";" ? `"${String(s).replace(/"/g, '""')}"` : String(s).replace(/[\t\n]/g, " ");
  const lines = [["Раздел", "Строк ИД", "Чек-лист ✓", "DWG ✓", ...ids.map((s) => s.name), ...cons.map((s) => s.name)].map(q).join(sep)];
  for (const x of summaryData()) {
    lines.push([q(x.f ? x.f.title || "Раздел" : "Вне разделов"), x.rows.length, x.rows.filter((r) => r.ck).length, x.rows.filter((r) => r.dwg).length,
      ...x.ids.map(([, c]) => c), ...x.cons.map(([, c]) => c)].join(sep));
  }
  return lines.join("\r\n") + "\r\n";
}
function downloadCsv() {
  // Excel в России открывает CSV с «;» и BOM — русские буквы и столбцы на месте.
  const blob = new Blob(["﻿" + table(";")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = `${B.title.replace(/[\\/:*?"<>|]/g, " ")} — сводка ${d.toLocaleDateString("ru-RU")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Скопировано — вставьте в Excel"); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("Скопировано"); }
}
function toast(text) { progress(text); setTimeout(showImgProgress, 2500); }

function openModal(title, html, buttons) {
  $("mTitle").textContent = title; $("mBody").innerHTML = html;
  const box = $("mButtons"); box.innerHTML = "";
  for (const [label, fn, primary] of buttons) { const b = document.createElement("button"); b.textContent = label; if (primary) b.className = "primary"; b.onclick = fn; box.appendChild(b); }
  $("modal").hidden = false;
}
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

$("legendBtn").onclick = () => { const L = $("legend"); if (L.hidden) { buildLegend(); L.hidden = false; } else { L.hidden = true; highlight = null; redraw(true); } };
$("summaryBtn").onclick = summary;
$("linkBtn").onclick = async () => {
  try {
    const r = await api("view_link", { board: B.board, key: B.key });
    const url = API + "?v=" + r.code.slice(0, 4) + "-" + r.code.slice(4);
    openModal("Ссылка для руководства", `<p>По этой ссылке доску можно только смотреть — ничего не изменить. Код: <b>${r.code.slice(0, 4)}-${r.code.slice(4)}</b></p><div class="link">${esc(url)}</div>`,
      [["Скопировать ссылку", () => copy(url)], ["Готово", closeModal, true]]);
  } catch (e) { toast("Не удалось: " + e.message); }
};
$("logout").onclick = () => {
  lsSet("fw-viewer", null);
  location.href = API;
};

// ------------------------------------------------------------ вход

function normCode(s) { return String(s || "").toUpperCase().replace(/[\s-]/g, "").replace(/0/g, "O").replace(/1/g, "I"); }
$("code").addEventListener("input", (e) => {
  const c = normCode(e.target.value).slice(0, 8);
  e.target.value = c.length > 4 ? c.slice(0, 4) + "-" + c.slice(4) : c;
});
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = normCode($("code").value);
  $("loginErr").textContent = "";
  if (code.length !== 8) { $("loginErr").textContent = "В коде 8 знаков, например ABCD-EFGH"; return; }
  $("openBtn").disabled = true;
  try { await openByCode(code); } catch (err) { $("loginErr").textContent = err.message; }
  $("openBtn").disabled = false;
});

async function openByCode(code) {
  let r, edit = false;
  try { r = await api("view", { code }); }
  catch (e) {
    if (e.code !== "no_view") throw e;
    r = await api("join", { invite: code }); edit = true; // код доски из приложения
  }
  const sess = { board: r.board, key: r.key, edit, title: r.title || "Доска" };
  lsSet("fw-viewer", JSON.stringify(sess));
  history.replaceState(null, "", API + "?v=" + code.slice(0, 4) + "-" + code.slice(4));
  await start(sess);
}

async function start(sess) {
  Object.assign(B, { board: sess.board, key: sess.key, edit: !!sess.edit, title: sess.title, seq: 0 });
  B.objs.clear();
  $("login").hidden = true; $("app").hidden = false;
  $("linkBtn").hidden = !B.edit;
  resize();
  // Вид — как оставили в прошлый раз на этом компьютере; первый раз — вся доска.
  let saved = null;
  try { saved = JSON.parse(lsGet("fw-cam-" + B.board) || "null"); } catch (e) { saved = null; }
  if (saved) Object.assign(cam, saved);
  const had = await loadCached();
  if (had) { if (!saved) fitAll(); redraw(true); updateState(); }
  try {
    await pullAll(true);
    lastOk = Date.now();
  } catch (e) {
    if (e.status === 403 || e.status === 404) { lsSet("fw-viewer", null); throw new Error("Доступ к доске закрыт — попросите новую ссылку"); }
    updateState(e.message);
  }
  progress(null); showImgProgress();
  if (!had && !saved) fitAll();
  redraw(true);
  updateState();
  startPolling();
}

(async function boot() {
  const q = new URLSearchParams(location.search);
  const v = q.get("v") || location.hash.replace("#", "");
  const saved = lsGet("fw-viewer");
  if (v) {
    $("code").value = normCode(v).slice(0, 4) + "-" + normCode(v).slice(4, 8);
    try { await openByCode(normCode(v)); return; } catch (e) { $("login").hidden = false; $("app").hidden = true; $("loginErr").textContent = e.message; return; }
  }
  if (saved) {
    try { await start(JSON.parse(saved)); return; } catch (e) { $("login").hidden = false; $("app").hidden = true; $("loginErr").textContent = e.message; }
  }
})();
</script>
