<title>Макет учёта ИГС</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&family=Manrope:wght@600..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Макет шага 0: одна доска (двигать, приближать) с чертежом, таблицами ИД и ведомостями; ввод — телефон / планшет / компьютер. Одна светлая тема, как в ТЗ. */
:root{
  --desk:#E3E8EF; --paper:#F7F9FB; --surface:#FDFDFE; --ink:#16223A; --ink2:#4A5568; --muted:#5E6A7E;
  --rule:#D3DAE4; --line:#E6EAF0; --accent:#D4470C; --accent-ink:#B8410A; --accent-soft:#FDE8DC; --sel:#E3ECFC; --hl:#FFF1E0;
  --f-ui:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-head:'Manrope', 'Golos Text', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;background:var(--paper);border-radius:16px;overflow:hidden;border:1px solid var(--rule);position:relative}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface)}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-family:var(--f-head);font-size:17px;font-weight:800;white-space:nowrap}
.brand span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg{display:flex;background:var(--desk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,34,58,.15)}
.tbtn{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#F2F5F9;border-color:var(--ink)}
.tbtn:disabled{opacity:.45;cursor:default}
.bottombar{display:none;border-top:1px solid var(--rule);background:var(--surface);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
.bottombar button{flex:1;border:0;background:transparent;padding:8px 2px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
.bottombar svg,.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app.m-phone .bottombar{display:flex}
.app.m-phone .wide-only{display:none}
.vp{flex:1;position:relative;overflow:hidden;background:var(--desk);touch-action:none;cursor:grab;
  background-image:radial-gradient(circle, rgba(22,34,58,.10) 1px, transparent 1.2px);background-size:22px 22px}
.vp.lasso{cursor:crosshair}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.hint{position:absolute;left:12px;bottom:12px;max-width:min(560px, calc(100% - 72px));background:rgba(22,34,58,.86);color:#EEF2F7;font-size:13px;line-height:1.45;padding:8px 12px;border-radius:10px;cursor:pointer}
.hint small{display:block;color:#AEBBD0;margin-top:2px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);font-size:20px;font-weight:700}
.app.m-phone .hint{bottom:60px}
/* --- доска --- */
.frame{position:absolute;border:2px dashed #9AA6B8;border-radius:14px}
.frame-label{position:absolute;top:-38px;left:0;background:var(--ink);color:#F2F5F9;font-weight:700;font-size:18px;padding:5px 14px;border-radius:8px;white-space:nowrap}
.plan{position:absolute;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 2px 10px rgba(22,34,58,.08)}
.plan .zp{cursor:pointer}
.plan .zp.on rect{stroke:var(--accent);stroke-width:7;fill-opacity:.85}
.plan-cap{position:absolute;font-size:15px;color:var(--ink2);white-space:nowrap}
.tbl{position:absolute;background:var(--surface);border:1.5px solid #AFBACB;border-radius:10px;box-shadow:0 2px 12px rgba(22,34,58,.10);font-size:14px}
.tbl .tt{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:9px 14px;background:#E3EAF4;border-radius:9px 9px 0 0}
.tbl.ved .tt{background:#FBE7D3}
.tt b{font-family:var(--f-mono);font-size:19px}
.tt span{color:var(--ink2);font-size:14px;white-space:nowrap}
.tr{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:36px}
.tr.th{background:#F1F4F8;font-weight:600;color:var(--ink2);font-size:13px;min-height:30px}
.td{flex:none;padding:6px 9px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--line)}
.td:last-child{border-right:0}
.td.mono{font-family:var(--f-mono);font-weight:600}
.td .txt{overflow:hidden;text-overflow:ellipsis}
.tr.hl{background:var(--hl)}
.tr.sel{background:var(--sel)}
.tr.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:#FFD8BF}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.tr.flash{animation:none;background:#FFD8BF}}
.td.cur{outline:2.5px solid var(--accent);outline-offset:-2.5px;background:#FFF8F3}
.td input.cell{width:100%;border:0;outline:0;background:transparent;font-size:14px;padding:0}
.tadd{padding:8px 14px;color:var(--accent-ink);font-weight:700;border-top:1px solid var(--rule);cursor:pointer;display:flex;gap:18px;flex-wrap:wrap}
.tadd span{cursor:pointer}
.pill{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1.5px solid;border-radius:999px;padding:1px 9px;font-weight:600;font-size:13px;line-height:1.5}
.pill.big{font-size:15px;padding:5px 12px;border-radius:12px}
.mark{display:inline-block;font-size:12px;font-weight:700;color:#9A4505;background:#FCE7D6;border-radius:6px;padding:0 6px;margin-left:6px}
.vbtn{border:0;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px;margin-right:6px}
.vbtn.ok{background:#23803A;color:#F4FBF6}
.vbtn.rem{background:#FDFDFE;color:#9A4505;border:1.5px solid #D4640C}
.vbtn.no{background:#FDFDFE;color:#7A1628;border:1.5px solid #8E1B2F}
.prog{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:0 14px 8px;background:var(--line)}
.prog i{display:block}
/* --- панели --- */
.scrim{position:absolute;inset:0;background:rgba(22,34,58,.28)}
.panel{position:absolute;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(22,34,58,.25);z-index:5}
.app:not(.m-phone) .panel{top:0;right:0;bottom:0;width:min(440px, 100%);border-left:1px solid var(--rule)}
.app.m-phone .panel{left:0;right:0;bottom:0;max-height:82%;border-radius:20px 20px 0 0}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-family:var(--f-head);font-size:19px;font-weight:800;flex:1;min-width:0;text-wrap:balance}
.ph .x{border:0;background:var(--desk);width:36px;height:36px;border-radius:10px;font-size:18px;flex:none}
.pb{overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.sub{color:var(--ink2);font-size:14px;line-height:1.45}
.lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:52px;text-align:left}
.sbtn .k{font-size:14px;color:var(--muted);flex:none;width:82px}
.slist{display:flex;flex-direction:column;gap:7px}
.slist button{width:100%;text-align:left;border:1.5px solid;border-radius:12px;padding:11px 14px;font-weight:600;font-size:16px;min-height:48px;display:flex;justify-content:space-between;align-items:center}
.slist button.cur{border-width:3px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1}
.gbtn{border:1px solid var(--rule);background:var(--desk);border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px;min-height:46px}
.gbtn.pri{background:var(--accent);color:#FFF7F2;border-color:var(--accent)}
.gbtn.dark{background:var(--ink);color:#F2F5F9;border-color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input,.fld select{border:1px solid var(--rule);border-radius:10px;padding:9px 10px;font-size:15px;background:var(--surface);min-height:42px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#FFF7F2}
.kpis{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px}
.kpi{border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-head);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:13.5px}
.barrow .stk{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--line)}
.ctrl{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:12px;padding:9px 12px;text-align:left;background:var(--surface);width:100%}
.ctrl b{font-family:var(--f-head);font-size:22px;min-width:28px;color:#9E1F1F;font-variant-numeric:tabular-nums}
.res{display:flex;flex-direction:column;gap:6px}
.res button{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.ck input{width:20px;height:20px;flex:none}
.prev{overflow:auto;border:1px solid var(--rule);border-radius:10px}
.prev table{border-collapse:collapse;font-size:13px;min-width:520px}
.prev th,.prev td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.prev th{background:#DDEFE2}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .d{font-family:var(--f-mono);color:var(--muted);font-size:13px}
/* поп-ап у ячейки */
.pop{position:absolute;z-index:6;background:var(--surface);border:1px solid #9AA6B8;border-radius:12px;box-shadow:0 12px 32px rgba(22,34,58,.25);padding:8px;display:flex;flex-direction:column;gap:5px;width:280px}
.pop .slist button{min-height:38px;padding:6px 10px;font-size:14px}
.pop .num{font-family:var(--f-mono);color:var(--muted);margin-right:8px}
.pad{border:1.5px dashed #9AA6B8;border-radius:10px;background:#FBFCFD;touch-action:none;width:100%;height:110px;display:block}
/* выделение */
.selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--ink);color:#F2F5F9;border-radius:14px;padding:8px 10px;max-width:calc(100% - 24px)}
.selbar button{border:0;background:#2E3D5C;color:#F2F5F9;border-radius:9px;padding:7px 11px;font-weight:600;font-size:14px}
.selbar span{font-weight:700;padding:0 6px}
.app.m-phone .selbar{bottom:66px}
.lassosvg{position:absolute;inset:0;pointer-events:none}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:7;background:var(--ink);color:#F2F5F9;padding:9px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 24px)}
.toast button{border:0;background:transparent;color:#F7A77E;font-weight:700}
.note{font-size:13px;color:var(--muted);background:var(--desk);border-radius:10px;padding:8px 10px;line-height:1.45}
</style>

<div class="app" id="app">
  <div class="bar">
    <div class="brand"><b>Объект «Пример»</b><span>макет · данные выдуманы, ничего не сохраняется</span></div>
    <div class="seg" role="group" aria-label="Устройство">
      <button id="m-phone" data-mode="phone">Телефон</button>
      <button id="m-tablet" data-mode="tablet">Планшет</button>
      <button id="m-pc" data-mode="pc">Компьютер</button>
    </div>
    <button class="tbtn wide-only" id="b-lasso" aria-pressed="false" hidden>Выделить</button>
    <button class="tbtn wide-only" id="b-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Поиск</button>
    <button class="tbtn wide-only" id="b-sum"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Сводка</button>
    <button class="tbtn wide-only" id="b-veds"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 13h7 M9 17h7"/></svg>Ведомости</button>
    <button class="tbtn wide-only" id="b-undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg>Отменить</button>
  </div>
  <div class="vp" id="vp">
    <div class="world" id="world"></div>
    <svg class="lassosvg" id="lassosvg"></svg>
    <div class="hint" id="hint"></div>
    <div class="zoom"><button id="z-in" aria-label="Приблизить">+</button><button id="z-out" aria-label="Отдалить">−</button><button id="z-fit" aria-label="Показать всё" style="font-size:14px">⤢</button></div>
  </div>
  <div class="bottombar">
    <button id="bb-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Поиск</button>
    <button id="bb-sum"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Сводка</button>
    <button id="bb-veds"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 13h7 M9 17h7"/></svg>Ведомости</button>
    <button id="bb-undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg>Отменить</button>
  </div>
  <div id="layer"></div>
</div>

<script>
(function(){
'use strict';
// ------------------------------------------------------------------ данные
const TODAY = '2026-11-11';
const ME = 'Вы';
function addDays(s, n){ const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function days(s){ return Math.round((Date.parse(TODAY + 'T00:00:00Z') - Date.parse(s + 'T00:00:00Z')) / 86400000); }
function fd(s){ if (!s) return ''; const p = s.split('-'); return p[2] + '.' + p[1] + '.' + p[0].slice(2); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function minD(a, b){ return a < b ? a : b; }

const S_IGS = [
  {id:'nv', n:'Не выполнено', c:'#8A93A3', bg:'#ECEEF2', fg:'#4E5666', bd:'#B9BFCA'},
  {id:'np', n:'Не предоставлена', c:'#C62828', bg:'#FBE3E3', fg:'#9E1F1F', bd:'#E89A9A'},
  {id:'wk', n:'В работе', c:'#1F5FD1', bg:'#E2EBFB', fg:'#1A4BA6', bd:'#9DB8EC'},
  {id:'an', n:'На подписи АН', c:'#7B3FC4', bg:'#EFE6FA', fg:'#5E2F99', bd:'#C3A6E6'},
  {id:'ns', n:'Не согласована', c:'#8E1B2F', bg:'#F4E1E5', fg:'#7A1628', bd:'#CE95A1'},
  {id:'zk', n:'На подписи у заказчика', c:'#B88A00', bg:'#FBF1D2', fg:'#6E5300', bd:'#E2C766'},
  {id:'vk', n:'Возврат на корректировку', c:'#D4640C', bg:'#FCE7D6', fg:'#9A4505', bd:'#EDB083'},
  {id:'pt', n:'Сдано в ПТО', c:'#23803A', bg:'#DFF1E3', fg:'#1B6B30', bd:'#93CDA2'}];
const S_CK = [
  {id:'nv', n:'Не выполнено', c:'#8A93A3', bg:'#ECEEF2', fg:'#4E5666', bd:'#B9BFCA'},
  {id:'np', n:'Не предъявлено', c:'#C62828', bg:'#FBE3E3', fg:'#9E1F1F', bd:'#E89A9A'},
  {id:'nb', n:'Нет возможности предъявить', c:'#D4640C', bg:'#FCE7D6', fg:'#9A4505', bd:'#EDB083'},
  {id:'ok', n:'Предъявлено', c:'#23803A', bg:'#DFF1E3', fg:'#1B6B30', bd:'#93CDA2'}];
const S_DWG = [
  {id:'nv', n:'Не выполнено', c:'#8A93A3', bg:'#ECEEF2', fg:'#4E5666', bd:'#B9BFCA'},
  {id:'no', n:'Нет', c:'#C62828', bg:'#FBE3E3', fg:'#9E1F1F', bd:'#E89A9A'},
  {id:'ok', n:'Есть', c:'#23803A', bg:'#DFF1E3', fg:'#1B6B30', bd:'#93CDA2'}];
const ST = {igs:S_IGS, ck:S_CK, dwg:S_DWG};
const KIND_NAME = {igs:'ИГС', ck:'Чек-лист', dwg:'DWG'};
function st(kind, id){ return ST[kind].find(s => s.id === id) || ST[kind][0]; }
function pill(kind, id, big){ const s = st(kind, id); return '<span class="pill' + (big ? ' big' : '') + '" style="background:' + s.bg + ';color:' + s.fg + ';border-color:' + s.bd + '">' + esc(s.n) + '</span>'; }

const WORKS = ['Опалубка','Армирование','Бетон','Разработка','Обратная засыпка','Кладка','Монтаж'];
const TABLES = [
  {id:'t1', cipher:'КЖ 6.1.1', x:700, y:0, con:'Стены и колонны', who:'Монолит-Строй'},
  {id:'t2', cipher:'КЖ 6.1.2', x:700, y:760, con:'Плита перекрытия', who:'СК Вектор'}];
const COLS = [
  {k:'zah', n:'Захватка', w:92, mono:1}, {k:'con', n:'Конструкция', w:170}, {k:'work', n:'Вид работ', w:128},
  {k:'date', n:'Дата работ', w:104}, {k:'ck', n:'Чек-лист', w:210, st:1}, {k:'dwg', n:'DWG', w:124, st:1},
  {k:'igs', n:'ИГС', w:236, st:1}, {k:'dCust', n:'Отдал заказчику', w:132}, {k:'dPto', n:'Сдано в ПТО', w:118},
  {k:'who', n:'Подрядчик', w:150}, {k:'note', n:'Примечание', w:220}];
const TEXT_COLS = ['zah','con','work','who','note'];
const DATE_COLS = ['date','dCust','dPto'];
const TBL_W = COLS.reduce((a, c) => a + c.w, 0);

let R = [], V = [], uid = 1;
function T(id){ return TABLES.find(t => t.id === id); }
function rec(t, zah, work, igs, ck, dwg, date, extra){
  const tb = T(t);
  const r = Object.assign({id:'r' + (uid++), t, zah, con:tb.con, work, date, ck, dwg, igs, who:tb.who, note:'', dCust:'', dPto:'', dAn:'', hist:[]}, extra || {});
  r.hist.push({d:date || '2026-07-01', who:'Ольга С.', what:'строка создана'});
  R.push(r); return r;
}
function seed(){
  const z1 = ['1','2','2.1','3','4','4.1','5','6'];
  const s1 = [['pt','pt'],['pt','pt'],['pt','pt'],['pt','vk'],['pt','zk'],['an','ns'],['wk','np'],['wk','nv']];
  z1.forEach((z, i) => {
    const d = addDays('2026-07-11', i * 9);
    ['Опалубка','Бетон'].forEach((w, j) => {
      const g = s1[i][j];

// ------------------------------------------------------------------ камера
function zoomAt(f, sx, sy){
  const z = Math.min(3, Math.max(0.08, S.cam.z * f));
  const k = z / S.cam.z;
  S.cam.x = sx - (sx - S.cam.x) * k; S.cam.y = sy - (sy - S.cam.y) * k; S.cam.z = z; applyCam();
}
function fit(x, y, w, h, pad){
  const r = vp.getBoundingClientRect(); pad = pad == null ? 40 : pad;
  const z = Math.min(3, Math.max(0.08, Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h)));
  S.cam.z = z; S.cam.x = r.width / 2 - (x + w / 2) * z; S.cam.y = r.height / 2 - (y + h / 2) * z; applyCam();
}
function fitAll(){ fit(-60, -80, 3480, 1360, 24); }
function showEl(el, minZ){
  if (!el) return;
  const r = vp.getBoundingClientRect(), b = el.getBoundingClientRect();
  if (minZ && S.cam.z < minZ) { zoomAt(minZ / S.cam.z, b.left + b.width / 2 - r.left, b.top + b.height / 2 - r.top); }
  const b2 = el.getBoundingClientRect();
  S.cam.x += r.width / 2 - (b2.left - r.left + b2.width / 2);
  S.cam.y += r.height / 2 - (b2.top - r.top + b2.height / 2);
  applyCam();
}
function showRec(id){

}

document.getElementById('z-out').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };

// ------------------------------------------------------------------ касания доски
const ptrs = new Map();
let gest = null;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('input,select,textarea,.zoom,.hint')) return;
  if (e.button > 0) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try { vp.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gest = {pinch:true, d:Math.hypot(a.x - b.x, a.y - b.y), mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2};
    return;
  }
  const r = vp.getBoundingClientRect();
  gest = {x0:e.clientX, y0:e.clientY, cx:S.cam.x, cy:S.cam.y, moved:false, target:e.target, shift:e.shiftKey || e.ctrlKey || e.metaKey,
    lasso: S.lasso && S.mode === 'tablet' ? [[e.clientX - r.left, e.clientY - r.top]] : null};
});
vp.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !gest) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const r = vp.getBoundingClientRect();
  if (gest.pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    S.cam.x += mx - gest.mx; S.cam.y += my - gest.my; applyCam();
    zoomAt(d / gest.d, mx - r.left, my - r.top);
    gest.d = d; gest.mx = mx; gest.my = my;
    return;
  }
  const dx = e.clientX - gest.x0, dy = e.clientY - gest.y0;
  if (!gest.moved && Math.hypot(dx, dy) > 6) gest.moved = true;
  if (!gest.moved) return;
  if (gest.lasso) {
    gest.lasso.push([e.clientX - r.left, e.clientY - r.top]);
    lassoSvg.innerHTML = '<polygon points="' + gest.lasso.map(p => p.join(',')).join(' ') + '" fill="rgba(31,95,209,.08)" stroke="#1F5FD1" stroke-width="2.5" stroke-dasharray="9 6"/>';
    return;
  }
  vp.style.cursor = 'grabbing';
  S.cam.x = gest.cx + dx; S.cam.y = gest.cy + dy; applyCam();
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  vp.style.cursor = '';
  if (!gest) return;
  if (gest.pinch) { if (ptrs.size === 0) gest = null; return; }
  const g = gest; gest = null;
  if (g.lasso && g.moved) { lassoSelect(g.lasso); lassoSvg.innerHTML = ''; return; }
  if (!g.moved && e.type === 'pointerup') onTap(g.target, e, g.shift);
}
vp.addEventListener('pointerup', endPtr);
vp.addEventListener('pointercancel', endPtr);
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  if (e.ctrlKey || Math.abs(e.deltaY) > 0 && !e.shiftKey) zoomAt(Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});

function lassoSelect(poly){
  const r = vp.getBoundingClientRect();
  const inside = (x, y) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  S.sel.clear();
  world.querySelectorAll('.tbl:not(.ved) [data-rec]').forEach(el => {
    const b = el.getBoundingClientRect();
    if (inside(b.left + 46 - r.left, b.top + b.height / 2 - r.top)) S.sel.add(el.dataset.rec);
  });
  if (!S.sel.size) toast('Обведите номера захваток в таблице');
  render();
}

function onTap(target, e, shift){
  const act = target.closest('[data-act]');
  if (act) { doAct(act.dataset, act, e); return; }
  const zp = target.closest('[data-zah-poly]');
  if (zp) { highlight('t1', zp.dataset.zahPoly, false); return; }
  const vr = target.closest('[data-vrec]');
  if (vr) { showRec(vr.dataset.vrec); return; }
  const row = target.closest('[data-rec]');
  if (row) { const cell = target.closest('[data-col]'); onRow(row.dataset.rec, cell ? cell.dataset.col : null, cell, shift); return; }
  // пусто
  let ch = false;
  if (S.sel.size) { S.sel.clear(); ch = true; }
  if (S.cur || S.edit) { commitEdit(); S.cur = null; ch = true; }
  if (S.hl) { S.hl = null; ch = true; }
  if (S.mark.size) { S.mark.clear(); ch = true; }
  if (S.pop) { S.pop = null; ch = true; }
  if (ch) render();
}

document.addEventListener('keydown', e => {

function doAct(d, el, e){

  if (a === 'vadd') { openPanel({type:'vedAdd', v:d.v, cipher:'all'}); return; }

  if (a === 'vrest') { const v = V.find(x => x.id === d.v); snap(); v.items.filter(i => !i.res).forEach(i => applyRes(v, i, VKIND[v.kind].res[0][0])); closeIfDone(v); render(); toast('Отмечено: ' + VKIND[v.kind].res[0][1]); return; }

function applyRes(v, i, res){

    '<div class="kpis"><div class="kpi"><b>' + recs.length + '</b><span>схем всего</span></div><div class="kpi"><b style="color:#1B6B30">' + pt + '</b><span>сдано в ПТО</span></div><div class="kpi"><b style="color:#6E5300">' + sign + '</b><span>на подписи (АН и заказчик)</span></div><div class="kpi"><b style="color:#9A4505">' + long + '</b><span>дольше 7 дней на подписи</span></div></div>' +
    '<span class="lbl">По шифрам</span><div class="bars">' + TABLES.filter(t => where === 'all' || t.id === where).map(t => { const rows = R.filter(r => r.t === t.id); return '<div class="barrow"><b class="mono">' + t.cipher + '</b>' + bar(rows) + '<span>сдано ' + rows.filter(r => r.igs === 'pt').length + ' из ' + rows.length + '</span></div>'; }).join('') + '</div>' +
    '<div class="chips">' + S_IGS.map(s => { const n = recs.filter(r => r.igs === s.id).length; return '<span class="pill" style="background:' + s.bg + ';color:' + s.fg + ';border-color:' + s.bd + '">' + esc(s.n) + ' · ' + n + '</span>'; }).join('') + '</div>' +
    '<span class="lbl">Контроль — касание покажет строки</span>' +
    '<button class="ctrl" data-p="ctrl" data-c="c1"><b>' + c1.length + '</b><span>чек-лист предъявлен, а схема «Не предоставлена»</span></button>' +
    '<button class="ctrl" data-p="ctrl" data-c="c2"><b>' + c2.length + '</b><span>схема в работе или дальше, а чек-лист не «Предъявлено»</span></button>' +
    '<button class="ctrl" data-p="ctrl" data-c="c3"><b>' + c3.length + '</b><span>на подписи дольше 7 дней</span></button>' +
    '<span class="lbl">По подрядчикам</span>' + whos.map(w => { const rows = recs.filter(r => r.who === w); return '<div class="sub">' + esc(w) + ' — ' + rows.length + ' схем, сдано ' + rows.filter(r => r.igs === 'pt').length + '</div>'; }).join('') +
    '<button class="gbtn pri" data-p="export">Выгрузить в Excel…</button>';
}
function exportHTML(p){
  p.f = p.f || {t:TABLES.map(t => t.id), igs:S_IGS.filter(s => s.id !== 'pt').map(s => s.id), who:[...new Set(R.map(r => r.who))], sheets:['sum','all','per']};

    '<span class="lbl">Подрядчики</span><div class="chips">' + [...new Set(R.map(r => r.who))].map(w => chip('who', w, w)).join('') + '</div>' +
    '<span class="lbl">Листы</span><div class="chips">' + chip('sheets', 'sum', 'Сводка') + chip('sheets', 'all', 'Все схемы') + chip('sheets', 'per', 'По листу на шифр') + '</div>' +
    '<div class="prev"><table><tr><th>Шифр</th><th>Захватка</th><th>Вид работ</th><th>Дата</th><th>ИГС</th><th>Подрядчик</th></tr>' +
    list.slice(0, 8).map(r => '<tr><td>' + esc(T(r.t).cipher) + '</td><td>' + esc(r.zah) + '</td><td>' + esc(r.work) + '</td><td>' + fd(r.date) + '</td><td>' + esc(st('igs', r.igs).n) + '</td><td>' + esc(r.who) + '</td></tr>').join('') + '</table></div>' +
    (list.length > 8 ? '<div class="sub">… и ещё ' + (list.length - 8) + '</div>' : '') +
    '<button class="gbtn pri" data-p="xgo" data-n="' + list.length + '">Выгрузить · ' + list.length + ' схем</button>';
}
function renderPanel(){
  let h = '';
  if (S.panel) {
    const c = panelHTML(S.panel);
    if (!c) { S.panel = null; }
    else h = (S.mode === 'phone' ? '<div class="scrim" data-p="close"></div>' : '') +
      '<div class="panel" role="dialog" aria-label="' + esc(c.title) + '"><div class="ph">' + (c.back ? '<button class="x" data-p="back" aria-label="Назад">←</button>' : '') + '<h3>' + esc(c.title) + '</h3><button class="x" data-p="close" aria-label="Закрыть">✕</button></div><div class="pb">' + c.body + '</div></div>';
  }
  h += '<datalist id="dl-who">' + [...new Set(R.map(r => r.who))].map(w => '<option value="' + esc(w) + '">').join('') + '</datalist>';
  h += '<datalist id="dl-con">' + [...new Set(R.map(r => r.con))].map(w => '<option value="' + esc(w) + '">').join('') + '</datalist>';
  h += popHTML();
  h += selbarHTML();
  if (S.toast) h += '<div class="toast" role="status"><span>' + esc(S.toast.text) + '</span>' + (S.toast.undo ? '<button data-p="undo">Отменить</button>' : '') + '</div>';
  layer.innerHTML = h;
  const q = document.getElementById('s-q');
  if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); q.oninput = () => { S.panel.q = q.value; renderPanel(); }; }
  bindCardInputs();
  bindPad();
}
function bindCardInputs(){
  if (!S.panel || S.panel.type !== 'card') return;
  const r = byId(S.panel.rec);
  const on = (id, key, fmt) => { const el = document.getElementById(id); if (!el) return; el.onchange = () => { const v = el.value.trim(); if (v !== r[key]) { snap(); log(r, (key === 'date' ? 'Дата работ' : key === 'who' ? 'Подрядчик' : 'Примечание') + ': «' + (fmt ? fmt(r[key]) : r[key]) + '» → «' + (fmt ? fmt(v) : v) + '»'); r[key] = v; renderWorld(); } }; };
  on('f-date', 'date', fd); on('f-who', 'who'); on('f-note', 'note');
}
function selbarHTML(){
  if (!S.sel.size || S.panel) return '';
  return '<div class="selbar"><span>Выбрано: ' + S.sel.size + '</span><button data-p="bulk" data-k="igs">ИГС всем</button><button data-p="bulk" data-k="ck">Чек-лист</button><button data-p="toved2">В ведомость</button><button data-p="bulknd">Не выполнено</button><button data-p="selx" aria-label="Снять выделение">✕</button></div>';
}
function popHTML(){
  const p = S.pop; if (!p) return '';
  const r = byId(p.rec); if (!r) return '';
  const W = 280, ar = app.getBoundingClientRect();
  let left = Math.min(Math.max(8, p.anchor.x), ar.width - W - 8), style;
  const below = p.anchor.y < ar.height * 0.55;
  style = 'left:' + left + 'px;' + (below ? 'top:' + (p.anchor.y + 4) + 'px' : 'bottom:' + (ar.height - p.anchor.top + 4) + 'px');
  let body;
  if (p.type === 'status') body = '<div class="lbl" style="padding:2px 4px">' + KIND_NAME[p.col] + (S.mode === 'pc' ? ' · или цифра 1–' + ST[p.col].length : '') + '</div>' + statusList(p.col, r[p.col], 'data-p="popset"');
  else if (p.type === 'date') body = '<div class="lbl" style="padding:2px 4px">' + COLS.find(c => c.k === p.col).n + '</div><input type="date" id="pop-date" value="' + r[p.col] + '" style="border:1px solid var(--rule);border-radius:10px;padding:8px;min-height:42px"><div class="row2"><button class="gbtn" data-p="today">Сегодня</button><button class="gbtn" data-p="nodate">Без даты</button></div><button class="gbtn dark" data-p="popdate">Готово</button>';
  else body = '<div class="lbl" style="padding:2px 4px">' + COLS.find(c => c.k === p.col).n + ' — напишите пером</div><canvas class="pad" id="pad" width="528" height="220"></canvas><div class="note">В приложении написанное распознаётся само. В макете перо не распознаётся — впишите с клавиатуры:</div><input id="pen-text" value="' + esc(r[p.col]) + '" style="border:1px solid var(--rule);border-radius:10px;padding:8px;min-height:42px"><button class="gbtn dark" data-p="penok">Готово</button>';
  return '<div class="pop" style="' + style + '">' + body + '</div>';
}
function bindPad(){
  const c = document.getElementById('pad'); if (!c) return;
  const g = c.getContext('2d'); g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1F4FD1';
  let drawing = false;
  const pt = e => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * c.width / b.width, (e.clientY - b.top) * c.height / b.height]; };
  c.onpointerdown = e => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pt(e); g.beginPath(); g.moveTo(x, y); };
  c.onpointermove = e => { if (!drawing) return; const [x, y] = pt(e); g.lineTo(x, y); g.stroke(); };
  c.onpointerup = () => { drawing = false; };
}
function renderPop(){ renderPanel(); }

layer.addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  const d = b.dataset, p = S.panel;
  switch (d.p) {
    case 'close': if (p && p.type === 'form') {} closePanel(); break;
    case 'back': if (p.backTo) { S.panel = p.backTo; renderPanel(); } else closePanel(); break;
    case 'undo': undo(); break;
    case 'pick': S.panel = {type:'pick', rec:p.rec, k:d.k, backTo:p}; renderPanel(); break;
    case 'set': { const r = byId(p.rec); snap(); setStatus(r, p.k, d.s); S.panel = p.backTo; render(); toast(KIND_NAME[p.k] + ': ' + st(p.k, d.s).n, true); break; }
    case 'prev': case 'next': { const r = byId(p.rec), rows = rowsOf(r.t), i = rows.findIndex(x => x.id === r.id) + (d.p === 'next' ? 1 : -1); if (rows[i]) { p.rec = rows[i].id; S.flash = rows[i].id; render(); } break; }
    case 'hist': S.panel = {type:'hist', rec:p.rec, backTo:p}; renderPanel(); break;
    case 'notdone': { const r = byId(p.rec); snap(); ['igs','ck','dwg'].forEach(k => setStatus(r, k, 'nv')); render(); toast('Отмечено: конструкция не выполнена', true); break; }
    case 'plan': { const r = byId(p.rec); closePanel(); highlight(r.t, r.zah, true); break; }
    case 'toved': S.panel = {type:'toved', ids:[p.rec], backTo:p}; renderPanel(); break;
    case 'toved2': S.panel = {type:'toved', ids:[...S.sel]}; renderPanel(); break;
    case 'tovedin': { snap(); const busy = addToVed(d.v, p.ids); const v = V.find(x => x.id === d.v); S.sel.clear(); S.panel = null; render(); showEl(world.querySelectorAll('.tbl.ved')[V.indexOf(v)], 0.6); toast('Добавлено в ' + v.no + (busy ? ' · ' + busy + ' уже ждут ответа в другой ведомости' : ''), true); break; }
    case 'tovednew': { snap(); const v = newVed(d.k, p.ids); S.sel.clear(); S.panel = null; render(); showEl(world.querySelectorAll('.tbl.ved')[V.indexOf(v)], 0.6); toast('Создан черновик ' + v.no + ' — проверьте и нажмите «Передать»', true); break; }
    case 'work': { const w = d.w, ws = p.works; const i = ws.indexOf(w); i >= 0 ? ws.splice(i, 1) : ws.push(w); renderPanel(); break; }
    case 'create': {
      const zah = document.getElementById('n-zah').value.trim(); if (!zah) { toast('Впишите номер захватки'); break; }
      const con = document.getElementById('n-con').value.trim(), date = document.getElementById('n-date').value, who = document.getElementById('n-who').value.trim();
      const ws = p.works.length ? p.works : [''];
      snap(); let n = 0;
      ws.forEach(w => { if (R.some(r => r.t === p.t && r.zah === zah && r.work === w)) return; const r = rec(p.t, zah, w, 'nv', 'nv', 'nv', date); r.con = con; r.who = who; r.hist = [{d:TODAY, who:ME, what:'строка создана'}]; n++; S.flash = r.id; });
      toast('Добавлено строк: ' + n + (n < ws.length ? ' (такие уже были — пропущены)' : ''), true);
      if (d.more) { S.panel = {type:'form', t:p.t, next:true, works:p.works.slice()}; } else S.panel = null;
      render(); break; }
    case 'vac': p.cipher = d.c; renderPanel(); break;
    case 'vaman': {
      const v = document.getElementById('va-man').value.split(',').map(s => s.trim());
      const t = TABLES.find(x => x.cipher.replace(/\s/g, '').toLowerCase() === (v[0] || '').replace(/\s/g, '').toLowerCase());
      if (!t || !v[1]) { toast('Формат: КЖ 6.1.2, 6, Бетон'); break; }
      const r = R.find(x => x.t === t.id && x.zah === v[1] && (!v[2] || x.work.toLowerCase() === v[2].toLowerCase()));
      if (r) { const vd = V.find(x => x.id === p.v); if (!vd.items.some(i => i.r === r.id)) { snap(); vd.items.push({r:r.id, res:null, rd:''}); } p.ask = null; renderWorld(); renderPanel(); toast('Найдено и добавлено: ' + t.cipher + ' · ' + r.zah + ' · ' + r.work); }
      else { p.ask = {t:t.id, zah:v[1], work:v[2] || 'Бетон'}; renderPanel(); }
      break; }
    case 'vacreate': { const a = p.ask; snap(); const r = rec(a.t, a.zah, a.work[0].toUpperCase() + a.work.slice(1), 'wk', 'ok', 'no', ''); r.hist = [{d:TODAY, who:ME, what:'строка создана из ведомости'}]; V.find(x => x.id === p.v).items.push({r:r.id, res:null, rd:''}); p.ask = null; S.flash = r.id; render(); toast('Строка создана в «' + T(a.t).cipher + '» и добавлена в ведомость', true); break; }
    case 'vaskip': p.ask = null; renderPanel(); break;
    case 'vaok': closePanel(); break;
    case 'goved': { const v = V.find(x => x.id === d.v); if (S.mode === 'phone') closePanel(); showEl(world.querySelectorAll('.tbl.ved')[V.indexOf(v)], 0.6); break; }
    case 'go': { if (S.mode === 'phone') closePanel(); showRec(d.r); break; }
    case 'where': p.where = d.w; renderPanel(); break;
    case 'ctrl': {
      const fn = {c1:r => r.ck === 'ok' && r.igs === 'np', c2:r => ['wk','an','ns','zk','vk'].includes(r.igs) && r.ck !== 'ok', c3:isLong}[d.c];
      const list = R.filter(r => (!p.where || p.where === 'all' || r.t === p.where) && fn(r));
      S.mark = new Set(list.map(r => r.id)); if (S.mode === 'phone') S.panel = null; render();
      if (list[0]) showEl(world.querySelector('.tbl:not(.ved) [data-rec="' + list[0].id + '"]'), 0.7);
      toast('Подсвечено строк: ' + list.length); break; }
    case 'export': S.panel = {type:'export', backTo:p}; renderPanel(); break;
    case 'xf': { const a = p.f[d.g], i = a.indexOf(d.id); i >= 0 ? a.splice(i, 1) : a.push(d.id); renderPanel(); break; }
    case 'xgo': toast('В приложении здесь сохранится файл «ИГС_' + TODAY + '.xlsx» (' + d.n + ' схем) — в макете файл не создаётся'); break;
    case 'bulk': S.panel = {type:'bulk', k:d.k, ids:[...S.sel]}; renderPanel(); break;
    case 'bulkset': { snap(); p.ids.forEach(id => setStatus(byId(id), p.k, d.s)); S.panel = null; render(); toast(KIND_NAME[p.k] + ' «' + st(p.k, d.s).n + '» — для ' + p.ids.length + ' строк', true); break; }
    case 'bulknd': { snap(); S.sel.forEach(id => ['igs','ck','dwg'].forEach(k => setStatus(byId(id), k, 'nv'))); render(); toast('Отмечено «не выполнено»: ' + S.sel.size, true); break; }
    case 'selx': S.sel.clear(); render(); break;
    case 'popset': { const pp = S.pop, r = byId(pp.rec); snap(); setStatus(r, pp.col, d.s); S.pop = null; render(); toast(KIND_NAME[pp.col] + ': ' + st(pp.col, d.s).n, true); break; }
    case 'today': document.getElementById('pop-date').value = TODAY; break;
    case 'nodate': document.getElementById('pop-date').value = ''; break;
    case 'popdate': { const pp = S.pop, r = byId(pp.rec), v = document.getElementById('pop-date').value; if (v !== r[pp.col]) { snap(); log(r, COLS.find(c => c.k === pp.col).n + ': ' + (fd(r[pp.col]) || '—') + ' → ' + (fd(v) || '—')); r[pp.col] = v; } S.pop = null; render(); break; }
    case 'penok': { const pp = S.pop, r = byId(pp.rec), v = document.getElementById('pen-text').value.trim(); if (v !== r[pp.col]) { snap(); log(r, COLS.find(c => c.k === pp.col).n + ': «' + r[pp.col] + '» → «' + v + '»'); r[pp.col] = v; } S.pop = null; render(); break; }
  }
});
layer.addEventListener('change', e => {
  const p = S.panel; if (!p) return;
  if (e.target.id === 'va-ready') { p.onlyReady = e.target.checked; renderPanel(); return; }
  if (p.type === 'vedAdd' && e.target.dataset.r) {
    const v = V.find(x => x.id === p.v); snap();

});

let toastTimer = null;
function toast(text, withUndo){ S.toast = {text, undo:!!withUndo}; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderPanel(); }, 4200); renderPanel(); }
const HINTS = {
  phone:'Телефон: касание любой части строки — карточка снизу, всё крупно. Один палец двигает доску, два — приближают. Коснитесь захватки на плане.',
  tablet:'Планшет: касание статуса — список рядом; касание текста — поле для пера. «Выделить» — обвести номера захваток, действие для всех. Коснитесь номера захватки — подсветится на плане.',
