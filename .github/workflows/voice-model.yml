name: Voice model

# Готовит модель распознавания речи для заметок ViaDesk (GigaAM v3 e2e CTC, Сбер, лицензия MIT)
# и кладёт её в выпуск «voice-model-1». Оттуда приложение скачивает её один раз (тот же адрес github.com,
# что и у APK). Сам APK модель не содержит.
#
# Запускается при изменении tools/voice или этого файла (на любой ветке) и вручную.
# Если модель поменялась — новый номер выпуска (MODEL_TAG) и новые отпечатки SHA-256 в VoiceModel.kt:
# приложение принимает только файлы с известными отпечатками.
on:
  push:
    paths:
      - 'tools/voice/**'
      - '.github/workflows/voice-model.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-model
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_TAG: voice-model-1
      # Код GigaAM, по которому готовится модель (чтобы результат не менялся сам).
      GIGAAM_REF: main
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: GigaAM
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          git clone -q https://github.com/salute-developers/GigaAM.git gigaam-src
          git -C gigaam-src checkout -q "$GIGAAM_REF"
          git -C gigaam-src log -1 --format='GigaAM %H %cd'
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ./gigaam-src
          pip list 2>/dev/null | grep -i -E "^(torch|torchaudio|onnx|onnxruntime|numpy|sentencepiece) "

      - name: Samples
        run: |
          curl -fsSL --retry 3 -o example.wav https://cdn.chatwm.opensmodel.sberdevices.ru/GigaAM/example.wav
          curl -fsSL --retry 3 -o long_example.wav https://cdn.chatwm.opensmodel.sberdevices.ru/GigaAM/long_example.wav
          ls -l *.wav

      - name: Export
        run: python tools/voice/export_gigaam.py --out out --audio example.wav long_example.wav

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp gigaam-src/LICENSE out/LICENSE-GigaAM.txt
          ls -l out
          if ! gh release view "$MODEL_TAG" >/dev/null 2>&1; then
            gh release create "$MODEL_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Модель распознавания речи (GigaAM v3, Сбер)" --notes-file tools/voice/RELEASE.md
          fi
          gh release upload "$MODEL_TAG" out/gigaam-v3-e2e-ctc-int8.onnx out/tokens.txt out/manifest.json \
            out/LICENSE-GigaAM.txt --clobber
