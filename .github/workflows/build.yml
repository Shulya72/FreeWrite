name: Build APK

# Сборка FreeWrite при каждом изменении основной ветки.
# Готовый APK, файл с номером версии и скриншоты экранов кладутся в выпуск «latest» —
# постоянная ссылка для планшета и для кнопки «Обновить» внутри приложения:
# https://github.com/Shulya72/FreeWrite/releases/download/latest/FreeWrite.apk
on:
  push:
    branches:
      - main
    # Сервер (Яндекс Облако), его сценарии и документы APK не меняют — пересобирать не нужно.
    paths-ignore:
      - 'server/**'
      - '.github/workflows/yc-*.yml'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  # Раз в неделю просто трогаем кэш с ключом подписи, чтобы GitHub его не удалил
  # (кэш, к которому не обращались 7 дней, удаляется — и следующая сборка была бы с другим ключом).
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Touch signing key cache
        uses: actions/cache/restore@v5
        with:
          path: freewrite-debug.keystore
          key: freewrite-debug-keystore-v1
      - run: '[ -f freewrite-debug.keystore ] && echo "Ключ подписи на месте" || echo "Ключа подписи нет в кэше"'

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Один и тот же ключ подписи между сборками, чтобы новая версия ставилась поверх старой.
      # Хранится в кэше Actions (в репозиторий не попадает); пароли — стандартные отладочные.
      - name: Signing key
        uses: actions/cache@v5
        with:
          path: freewrite-debug.keystore
          key: freewrite-debug-keystore-v1

      - name: Create signing key if missing
        run: |
          if [ ! -f freewrite-debug.keystore ]; then
            echo "Создаю новый ключ подписи"
            keytool -genkeypair -keystore freewrite-debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FreeWrite Debug,O=FreeWrite,C=RU" > /dev/null
          else
            echo "Ключ подписи взят из кэша"
          fi

      - name: Build APK
        env:
          FREEWRITE_DEBUG_KEYSTORE: ${{ github.workspace }}/freewrite-debug.keystore
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # Если сборка упала — показать, какие классы есть в библиотеке ML Kit (для разбора ошибки).
      - name: ML Kit classes (diagnostic)
        if: failure()
        run: |
          mkdir -p /tmp/mlkit
          find ~/.gradle/caches -name "*.aar" -path "*mlkit*" | sort | while read -r f; do
            echo "== $f"
            jar="/tmp/mlkit/$(basename "$f" .aar).jar"
            unzip -p "$f" classes.jar > "$jar" 2>/dev/null || continue
            unzip -l "$jar" | awk '{print $4}' | grep -i 'digitalink' | grep -v '/internal/\|/zz\|/downloading/' | head -120
          done

      # Проверка экранов на компьютере (Robolectric). Падение не мешает выложить APK,
      # но видно в журнале (строки PASSED/FAILED).
      - name: Screen check (Robolectric)
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare files
        id: files
        run: |
          set -euo pipefail
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/FreeWrite-$ver.apk"
          cp app/build/outputs/apk/debug/app-debug.apk out/FreeWrite.apk
          echo "$ver" > out/version.txt
          for f in app/build/screenshots/*.png; do
            [ -f "$f" ] && cp "$f" "out/screen-$(basename "$f")"
          done
          ls -la out
          sha256sum out/*.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs out/FreeWrite.apk | grep -E 'DN|SHA-256' || true
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          tag=latest
          gh release delete "$tag" --cleanup-tag --yes || true
          notes="FreeWrite $VERSION — ежедневник с рукописным вводом для Huawei MatePad Mini.
          Коммит: $GITHUB_SHA

          Установка: откройте на планшете ссылку на FreeWrite.apk, скачайте и установите.
          Дальше обновления ставятся кнопкой «Обновления» внутри приложения."
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --title "FreeWrite $VERSION" \
            --notes "$notes"
